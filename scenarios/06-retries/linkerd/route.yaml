# Linkerd configures retries with annotations on the route rather than the
# experimental retry field of Gateway API, so this works with the standard
# channel CRDs. Only idempotent requests should be retried; these are GETs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payments-retries
  namespace: demo
  annotations:
    retry.linkerd.io/http: 5xx
    retry.linkerd.io/limit: "3"
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: payments
      port: 9898
  rules:
    - backendRefs:
        - name: payments-v1
          port: 9898
