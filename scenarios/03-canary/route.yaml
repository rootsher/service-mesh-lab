# Gateway API with a Service as the parent: the route applies to traffic sent
# to payments from inside the mesh, not to an ingress. Linkerd and Istio read
# this file as it is.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payments-canary
  namespace: demo
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: payments
      port: 9898
  rules:
    - backendRefs:
        - name: payments-v1
          port: 9898
          weight: 90
        - name: payments-v2
          port: 9898
          weight: 10
